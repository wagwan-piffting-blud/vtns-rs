[package]
name = "vtpaul"
version = "0.1.0"
edition = "2021"
description = "Native synthesizer for VoiceText (Voiceware) Paul M16 voice databases"
license = "GPL-3.0-only"

[lib]
name = "vtpaul"
path = "src/lib.rs"

[[bin]]
name = "vtpaul"
path = "src/bin/vtpaul.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
